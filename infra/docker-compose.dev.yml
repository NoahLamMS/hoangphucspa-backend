name: hps-dev
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64                 # chạy qua Rosetta trên Apple Silicon
    container_name: hps-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"              # prod dùng Express; muốn giống hệt prod thì đổi thành "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Chưa đặt MSSQL_SA_PASSWORD trong hoangphucspa-backend/infra/.env}
    ports:
      - "127.0.0.1:1433:1433"             # chỉ mở cho máy bạn, không mở ra mạng LAN
    volumes:
      - hps-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  mailpit:
    image: axllent/mailpit:latest         # bắt mọi email API gửi ra, xem ở http://localhost:8025
    container_name: hps-mailpit
    ports:
      - "127.0.0.1:8025:8025"             # giao diện web
      - "127.0.0.1:1025:1025"             # SMTP cho API
volumes:
  hps-sql-data:
    name: hps-sql-data
